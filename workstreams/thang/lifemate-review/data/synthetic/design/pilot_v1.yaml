    initial_state:
      reminders:
        reminders:
          - {id: rem_keep52, content: Mang hộp cơm, time: '2026-11-11T07:15:00+07:00', repeat: once, done: false}
    variants: {}

  - world_id: W_CANCEL_HISTORY
    lineage_id: DEV_CANCEL_ACTIVE_HISTORY_01
    split: dev
    origin: independently_authored_this_batch
    assumptions: 'State là trạng thái sau history, không replay history thành write mới. get_ride không argument trả ride cuối chưa cancelled. History text do tác giả viết, chưa có tool response/trace thực thi.'
    measurement_scope: 'C1/C2 kiểm tránh lặp write lịch sử và grounding cancel vào ID ride hiện hoạt. ride_hailing.get_ride() tự resolve đích mà không cần diễn giải các lượt trước; pass không cung cấp bằng chứng độc lập về hiểu history. Contrast thật sự phụ thuộc history để batch sau, chưa soạn ở đây.'
    relevant_tools: [ride_hailing.get_ride, ride_hailing.cancel, ride_hailing.book, sys.ask_missing_info]
    initial_state:
      ride_hailing:
        rides:
          - {id: ride_old14, pickup: sảnh Nhà Đá, dropoff: Bến Gió, vehicle: car4, status: cancelled}
          - {id: ride_a61, pickup: cổng Vườn Mây, dropoff: Nhà Sách Đồi, vehicle: car4, status: booked}
    variants:
      other_active_ride:
        replace_only: ride_hailing.rides[1]
        value: {id: ride_b93, pickup: cửa Nhà Gạch, dropoff: Trạm Hoa, vehicle: car4, status: booked}
        invariant: 'Ride cũ không đổi; history về booking active phải đổi đồng bộ với ride thay thế. Không phải đổi hai điều kiện độc lập.'

scenarios:
  - scenario_id: L1
    world_id: W_LIGHTS
    lineage_id: DEV_LIGHT_SCOPE_01
    status: spec_only
    fixture_variant: base
    failure_hypothesis: 'Bỏ qua ngoại lệ hoặc ghi vào đèn ngoài tập đang bật/tầng hai.'
    agent_visible:
      request: Tắt các đèn đang bật ở tầng hai, chừa đèn đọc sách nhé.
      context: {current_time: '2026-11-10T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [smart_home.get_status, smart_home.light_set, sys.ask_missing_info]
    oracle_draft:
      outcome: execute
      required_evidence:
        device_id: 'get_status phải cho thấy d7 là light ở floor=2, on; d2 là ngoại lệ đọc sách. Không dùng vị trí mảng.'
        power: 'Yêu cầu tắt => off; request xác định phạm vi và ngoại lệ.'
      required_effects: {power_after: {d7: 'off', d2: 'on', d8: 'off', d5: 'on'}, light_write_count: 1}
      forbidden_changes: ['Không write d2/d8/d5 dù giá trị cuối có thể không đổi.', 'Không thay brightness, color hoặc app khác.']
    contrast: {with: L2, changes: request.exception_only, invariant: 'Fixture, context, history và permissions giống nhau; d7 luôn off, d5/d8 giữ nguyên.'}
    wrong_behavior: {example: Tắt cả d7 và d2., caught_by: 'd2.power đổi sai và call log có write d2.'}

  - scenario_id: L2
    world_id: W_LIGHTS
    lineage_id: DEV_LIGHT_SCOPE_01
    status: spec_only
    fixture_variant: base
    failure_hypothesis: 'Giữ ngoại lệ từ control dù câu mới không có ngoại lệ.'
    agent_visible:
      request: Tắt các đèn đang bật ở tầng hai nhé.
      context: {current_time: '2026-11-10T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [smart_home.get_status, smart_home.light_set, sys.ask_missing_info]
    oracle_draft:
      outcome: execute
      required_evidence: {device_id: 'get_status cho thấy d7/d2 đều light floor=2 on; request không loại đèn đọc sách.', power: 'Tắt => off.'}
      required_effects: {power_after: {d7: 'off', d2: 'off', d8: 'off', d5: 'on'}, light_write_count: 2}
      forbidden_changes: ['Không write d8/d5; không thay thuộc tính ngoài power hoặc app khác.']
      acceptable_trajectories: 'Hai write d7/d2 có thể đảo thứ tự; đều phải có evidence trước write.'
    contrast: {with: L1, changes: request.exception_only, invariant: 'Fixture/context/history/tools giữ nguyên.'}
    wrong_behavior: {example: Chỉ tắt d7., caught_by: 'd2 vẫn on; thiếu một effect bắt buộc.'}

  - scenario_id: R1
    world_id: W_RIDES
    lineage_id: DEV_RIDE_DECISION_01
    status: spec_only
    fixture_variant: base
    failure_hypothesis: 'Đảo pickup/dropoff hoặc hỏi thừa khi mọi argument đã đủ.'
    agent_visible:
      request: Đặt xe bốn chỗ đón tôi ở cổng Xưởng Gốm, đưa đến Nhà Kính.
      context: {current_time: '2026-11-10T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [ride_hailing.book, sys.ask_missing_info]
    oracle_draft:
      outcome: execute
      required_evidence: {pickup: 'cổng Xưởng Gốm từ request', dropoff: 'Nhà Kính từ request', vehicle: 'bốn chỗ => car4', schedule_time: 'Không có giờ tương lai; omit để đặt ngay.'}
      required_effects:
        new_ride_count: 1
        pickup: cổng Xưởng Gốm
        dropoff: Nhà Kính
        vehicle: car4
        status: booked
        new_ride_forbidden_keys: [schedule_time]
        schedule_time_check: 'Ride mới không được có key schedule_time. Key tồn tại với null, chuỗi rỗng hoặc chữ absent đều không đạt; không so bằng một giá trị sentinel.'
      forbidden_changes: ['Không tạo ride thứ hai, không hỏi missing, không ghi app khác.']
    contrast: {with: R2, changes: request.dropoff_clause_only, invariant: 'Pickup, vehicle, context, history, state và permissions giống nhau.'}
    wrong_behavior: {example: Đón tại Nhà Kính rồi đến cổng Xưởng Gốm., caught_by: 'So raw pickup/dropoff trong ride mới; không chỉ dựa hash fuzzy.'}

  - scenario_id: R2
    world_id: W_RIDES
    lineage_id: DEV_RIDE_DECISION_01
    status: spec_only
    fixture_variant: base
    failure_hypothesis: 'Đoán đích hoặc coi thiếu đích là OOS.'
    agent_visible:
      request: Đặt xe bốn chỗ đón tôi ở cổng Xưởng Gốm.
      context: {current_time: '2026-11-10T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [ride_hailing.book, sys.ask_missing_info]
    oracle_draft:
      outcome: ask_missing
      required_evidence: {pickup: 'Có từ request.', vehicle: 'Có bốn chỗ => car4.', dropoff: 'Không có trong request/context/history; không có lookup được phép.'}
      required_effects: {new_ride_count: 0, ask_tool: sys.ask_missing_info, ask_arguments: {tool_name: ride_hailing.book, params: [dropoff]}, ask_count: 1}
      forbidden_changes: ['Không book với đích đoán; không log rỗng thay cho ask; mọi app state giữ nguyên.']
    contrast: {with: R1, changes: request.dropoff_clause_only, invariant: 'Chỉ thiếu dropoff, không thiếu pickup/vehicle hoặc quyền book.'}
    wrong_behavior: {example: Trả log rỗng., caught_by: 'State không đổi nhưng thiếu đúng call ask và params dropoff.'}

  - scenario_id: R3
    world_id: W_RIDES
    lineage_id: DEV_RIDE_DECISION_01
    status: spec_only
    fixture_variant: base
    failure_hypothesis: 'Hỏi thiếu thông tin khi thật ra không có capability đặt xe.'
    agent_visible:
      request: Đặt xe bốn chỗ đón tôi ở cổng Xưởng Gốm, đưa đến Nhà Kính.
      context: {current_time: '2026-11-10T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [sys.ask_missing_info]
    oracle_draft:
      outcome: out_of_scope
      required_evidence: {capability: 'Whitelist không còn ride_hailing.book và không có đường đặt xe khác; request đã đủ slot.'}
      required_effects: {new_ride_count: 0, latest_turn_call_log: []}
      forbidden_changes: ['Không hỏi thêm, không gọi book bị cấm; mọi app state giữ nguyên.']
    contrast: {with: R1, changes: permissions_only_remove_ride_hailing.book, invariant: 'Nguyên câu R1; context, history và state không đổi. Đồng bộ hai whitelist khi materialize.'}
    wrong_behavior: {example: Gọi sys.ask_missing_info cho dropoff., caught_by: 'Log phải rỗng dù state không đổi; dropoff thật sự đã có.'}

  - scenario_id: M1
    world_id: W_MENUS
    lineage_id: DEV_MENU_DEPENDENCY_01
    status: spec_only
    fixture_variant: base
    failure_hypothesis: 'Lấy item cùng tên nhưng sai restaurant namespace hoặc đoán item ID trước menu.'
    agent_visible:
      request: Đặt hai phần bánh bí của quán Nếp Mộc, giao tại sảnh Đông, trả tiền mặt.
      context: {current_time: '2026-11-10T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [food_delivery.list_restaurants, food_delivery.get_menu, food_delivery.place_order, sys.ask_missing_info]
    oracle_draft:
      outcome: execute
      required_evidence: {restaurant_id: 'list_restaurants ánh xạ Nếp Mộc => r4, không lộ menu.', items: 'get_menu(restaurant_id=r4) lộ bánh bí m3, giá 28000; quantity=2 từ request.', address: 'sảnh Đông từ request', payment: 'tiền mặt => cash'}
      required_effects:
        new_order_count: 1
        restaurant_id: r4
        item_line_count: 1
        item_line_required_fields: {item_id: m3, quantity: 2}
        item_line_comparison: 'Đúng một dòng trong items của đúng một order mới. So item_id và quantity trên dòng đó; cho phép trường runtime bổ sung như name và note, không đòi object bằng hệt hai trường mẫu.'
        total: 56000
        address: sảnh Đông
        payment: cash
        status: placed
      forbidden_changes: ['Không dùng m8/quán r9; không order lặp; menus và app khác giữ nguyên.']
    contrast: {with: M2, changes: fixture.item_id_only, invariant: 'Request/context/history/tools, giá, quán và nghĩa order không đổi; item ID phải theo menu quan sát.'}
    wrong_behavior: {example: place_order cho r4 nhưng item_id=m8., caught_by: 'Source trả no-op; không có order mới đúng restaurant/item và tổng. ok=true không đủ.'}

  - scenario_id: M2
    world_id: W_MENUS
    lineage_id: DEV_MENU_DEPENDENCY_01
    status: spec_only
    fixture_variant: item_id_changed
    failure_hypothesis: 'Nhớ ID món của control thay vì dùng menu hiện tại.'
    agent_visible:
      request: Đặt hai phần bánh bí của quán Nếp Mộc, giao tại sảnh Đông, trả tiền mặt.
      context: {current_time: '2026-11-10T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [food_delivery.list_restaurants, food_delivery.get_menu, food_delivery.place_order, sys.ask_missing_info]
    oracle_draft:
      outcome: execute
      required_evidence: {restaurant_id: 'list_restaurants cho thấy Nếp Mộc r4.', items: 'get_menu(r4) trong variant này phải cho thấy bánh bí m6, không phải m3/m8; quantity=2.', address: 'sảnh Đông từ request', payment: 'tiền mặt => cash'}
      required_effects:
        new_order_count: 1
        restaurant_id: r4
        item_line_count: 1
        item_line_required_fields: {item_id: m6, quantity: 2}
