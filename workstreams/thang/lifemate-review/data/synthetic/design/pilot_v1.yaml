  - world_id: W_REMINDER
    lineage_id: DEV_REMINDER_MIDNIGHT_01
    split: dev
    origin: independently_authored_this_batch
    assumptions: 'Timezone Asia/Saigon; ngày mai tính theo current_time của từng scenario, không theo đồng hồ máy. create chỉ lưu timestamp/content, chưa xác minh trigger chạy.'
