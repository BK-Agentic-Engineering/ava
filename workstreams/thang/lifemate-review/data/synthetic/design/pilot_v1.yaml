# Thiết kế nội bộ: không đưa nguyên file này cho solver.
version: pilot_v1
authored_date: '2026-11-03'
status: spec_only
split: dev
release_target: {approximately: 2000, unit: verified_scenarios_across_train_dev_test, sufficiency_claim: false}
batch_scope: '16 scenario để review authoring, không phải gold thực thi hoặc training export.'
provenance:
  existing_seeds: docs/plans/WORLD_PILOT_DESIGN.md
  design_policy: docs/plans/WORLD_FAILURE_DATASET_PLAN.md
  interface_review: docs/implementation/ORGANIZER_DATASET_STRUCTURE_REVIEW.md
  evidence_review: docs/research/WORLD_FAILURE_EVIDENCE_2026-11-03.md
  new_material: 'SMS, chuyển tiền, reminder và history hủy xe được tự viết; không lấy tên/câu/quan hệ/state từ mẫu BTC hoặc benchmark ASR.'
  boundary: 'Chỉ đọc catalog và safe source; không đọc organizer JSONL, labels, audio hoặc environment contents. Không dùng ASR test để sinh seed.'
interface_pair:
  archive: 'D:/Downloads/train+public_test.zip'
  release: v3.2.0
  catalog_member: train+public_test/train/train_tools_catalog.json
  catalog_schema_version: '2.7.0'
  runtime_root: train+public_test/train/zaic_tools/
  verification: static_catalog_and_source_only
  checked_sources: [apps/smart_home.py, apps/contacts.py, apps/sms.py, apps/banking.py, apps/reminders.py, apps/ride_hailing.py, apps/food_delivery.py, apps/base.py]
  source_access: 'Chỉ các catalog/safe source nêu ở đây và executor.py được đọc từ archive; không import/execute runtime.'
  capability_contracts:
    smart_home.get_status: {required: [], optional_used: [floor, type]}
    smart_home.light_set: {required: [device_id], optional_used: [power]}
    ride_hailing.book: {required: [pickup, dropoff, vehicle], optional_used: []}
    ride_hailing.get_ride: {required: [], optional_used: []}
    ride_hailing.cancel: {required: [ride_id], optional_used: []}
    food_delivery.list_restaurants: {required: [], optional_used: []}
    food_delivery.get_menu: {required: [restaurant_id], optional_used: []}
    food_delivery.place_order: {required: [restaurant_id, items], optional_used: [address, payment], item_required: [item_id, quantity]}
    contacts.search: {required: [], optional_used: [query]}
    sms.send: {required: [content], target_groups: [[contact_id], [phone_number]]}
    banking.get_balance: {required: [], optional_used: []}
    banking.list_beneficiaries: {required: [], optional_used: []}
    banking.transfer: {required: [from_account_id, beneficiary_id, amount], optional_used: []}
    reminders.create: {required: [content, time], optional_used: [repeat]}
    sys.ask_missing_info: {required: [tool_name, params], optional_used: []}
authoring_conventions:
  solver_view: 'Chỉ request/context/history/allowed_tools trong agent_visible. Không phát WORLD, fixture, contrast, oracle hay review cho solver.'
  fixture_view: 'worlds và oracle_draft thuộc tác giả/verifier. Đây là minimum-state assumptions, chưa phải state.json đã chạy.'
  context_defaults: 'Mỗi agent_visible là context đầy đủ cho phép thử; dữ liệu lookup không nhúng vào prompt.'
  permissions: 'Khi materialize, đồng bộ allowed_tools với context.installed_apps.<app>.tools và runtime _meta.tools; không cấp thêm tool ngoài danh sách.'
  observations: 'required_evidence mô tả điều phải quan sát sau read hợp lệ, không phải tool response đã xảy ra. Không có fabricated response, gold call log hoặc state_hash.'
  trajectories: 'Có thể đọc rộng/hẹp hoặc đổi thứ tự các read độc lập nếu giữ evidence trước write và đúng effects/frame. Không bắt đúng một trace tối thiểu.'
  counts: '7 WORLD families, 7 development lineages, 16 spec_only; 0 execution_verified; 0 training_exports.'
  open_integration: 'Tài cần chốt materialization fixture, whitelist/history và log; Tú chưa chốt export. Không hold vì thiếu capability; toàn bộ batch vẫn chờ review và replay.'
  history_adapter_pending: 'History text là authoring view, không phải organizer record. Trước replay cần Tài map user text sang input text của harness; trước audio/export mới tạo audio references hợp lệ. Không bịa đường audio hay tool_results để lấp schema.'
  semantic_review_pending: 'Reviewer cần duyệt cách diễn đạt tương đương của SMS/reminder và địa điểm. Các mục required meaning là predicate dự thảo, chưa có verifier ngữ nghĩa đã chạy.'
  source_alignment_note: 'Pilot đèn mô tả power bằng prose; YAML đặt tại devices[].state.power đúng light_set nested=state. Đây chỉ là cụ thể hóa cấu trúc, giữ nguyên d7/d2/d8/d5 và outcomes. R3 giữ nguyên câu đầy đủ của R1, chỉ bỏ quyền book.'
  static_checks: 'Đã parse YAML với kiểm duplicate keys; kiểm 7 WORLD/7 lineage/16 ID, control/variant references, 15 tool contracts, không lộ opaque IDs, contrast đơn biến, ngày reminder, amount/sign và history/state consistency. Không có simulator execution hoặc xác minh gold.'
  privacy: 'Số điện thoại trong fixture là chuỗi giả lập do tác giả đặt, không khẳng định không thuộc thuê bao thật; chỉ dùng simulator, không gửi SMS/chuyển tiền/gọi xe thật.'

worlds:
  - world_id: W_LIGHTS
    lineage_id: DEV_LIGHT_SCOPE_01
    split: dev
    origin: existing_pilot_L1_L2
    assumptions: 'Không history; status phải lộ id/type/floor/name/power. ID chỉ thuộc fixture.'
    relevant_tools: [smart_home.get_status, smart_home.light_set, sys.ask_missing_info]
    initial_state:
      smart_home:
        devices:
          - {id: d7, name: đèn hắt tường, type: light, floor: 2, state: {power: 'on'}}
          - {id: d2, name: đèn đọc sách, type: light, floor: 2, state: {power: 'on'}}
          - {id: d8, name: đèn trần, type: light, floor: 2, state: {power: 'off'}}
          - {id: d5, name: đèn hành lang, type: light, floor: 1, state: {power: 'on'}}
    variants: {}

  - world_id: W_RIDES
    lineage_id: DEV_RIDE_DECISION_01
    split: dev
    origin: existing_pilot_R1_R2_R3
    assumptions: 'Không ride/history/đích ngầm trong profile; đặt ngay, car4; không có đường gọi xe ngoài book.'
    relevant_tools: [ride_hailing.book, sys.ask_missing_info]
    initial_state: {ride_hailing: {rides: []}}
    variants: {}

  - world_id: W_MENUS
    lineage_id: DEV_MENU_DEPENDENCY_01
    split: dev
    origin: existing_pilot_M1_M2
    assumptions: 'list_restaurants không trả menu; get_menu mới lộ item ID thuộc đúng quán.'
    relevant_tools: [food_delivery.list_restaurants, food_delivery.get_menu, food_delivery.place_order, sys.ask_missing_info]
    initial_state:
      food_delivery:
        restaurants:
          - {id: r4, name: Nếp Mộc, menu: [{id: m3, name: bánh bí, price: 28000}]}
          - {id: r9, name: Tán Lá, menu: [{id: m8, name: bánh bí, price: 31000}]}
        orders: []
    variants:
      item_id_changed:
        replace_only: food_delivery.restaurants[id=r4].menu[0].id
        value: m6
        invariant: 'Tên, giá, quán, menu r9, orders và visible input giữ nguyên.'

  - world_id: W_SMS
    lineage_id: DEV_SMS_RECIPIENT_01
    split: dev
    origin: independently_authored_this_batch
    assumptions: 'Mẹ duy nhất theo relation; tên gần giống không quyết định người nhận. contact_ref có thể tự điền contact khi phone đối sánh duy nhất; cả hai cùng truyền thì không được tự sửa.'
    relevant_tools: [contacts.search, sms.send, sys.ask_missing_info]
    initial_state:
      contacts:
        contacts:
          - {id: ct_m72, name: Lê Thanh Trúc, relation: mẹ, phone: '0907001206'}
          - {id: ct_k19, name: Lê Thanh Trúc Anh, relation: đồng nghiệp, phone: '0907001286'}
      sms: {messages: []}
    variants: {}

  - world_id: W_TRANSFER
    lineage_id: DEV_TRANSFER_REPAIR_01
    split: dev
    origin: independently_authored_this_batch
    assumptions: 'Hai tài khoản phân biệt theo tên; một người hưởng tên duy nhất. Không có target-account balance để suy cộng tiền. Nguồn accounts và beneficiaries là hai namespace.'
    relevant_tools: [banking.get_balance, banking.list_beneficiaries, banking.transfer, sys.ask_missing_info]
    initial_state:
      banking:
        accounts:
          - {id: acc_c46, name: Chi tiêu, balance: 2400000}
