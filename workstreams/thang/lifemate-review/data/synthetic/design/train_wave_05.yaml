    oracle_draft:
      outcome: execute
      sources: 'Same all-ready instruction; actual pre-write observations establish both idle and supported cycles. Once enabled, both actions required, either order.'
      policy: all_ready
      targets: [Máy sấy gác, Máy giặt sân]
      start_ids: [tr5_app_26, tr5_app_61]
      preserve: 'No other machine mutation or stop; evaluate condition before group starts, not after first action.'
    contrast: {with: TR5_A_ALL_BUSY, changes: washer_readiness_only}
    wrong_behavior: 'Re-evaluate after first start and suppress the second even though both were ready initially.'
