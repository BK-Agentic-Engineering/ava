scenarios:
  - scenario_id: TR5_A_PARTIAL_BUSY
    world_id: W_TR5_PARTIAL_APPLIANCES
    lineage_id: TRAIN_PARTIAL_APPLIANCES_05
    status: spec_only
    exportable: false
    fixture_variant: base
    agent_visible:
      request: &partial 'Cho Máy sấy gác và Máy giặt sân chạy chu trình normal ngay. Với từng máy, nếu đang rảnh thì bắt buộc chạy; nếu đang chạy thì để nguyên. Máy rảnh vẫn phải chạy dù máy kia bận. Không dừng hay đổi việc đang chạy, không đụng máy khác.'
      context: &ctx {current_time: '2027-01-04T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: *atools
    oracle_draft:
      outcome: execute
      sources: 'Names/cycle/immediate intent supplied. Actual list resolves each ID, supported cycle and readiness; user requires the ready action independently of busy second.'
      policy: each_ready
      targets: [Máy sấy gác, Máy giặt sân]
      start_ids: [tr5_app_26]
      preserve: 'Running washer eco job unchanged; dryer starts normal, zero stop attempts and no other machine changes.'
    contrast: {with: [TR5_A_ALL_BUSY, TR5_A_PARTIAL_READY], changes: partial_permission_or_washer_readiness}
    wrong_behavior: 'Omit ready dryer because washer busy, or stop washer to force both actions.'
  - scenario_id: TR5_A_ALL_BUSY
    world_id: W_TR5_PARTIAL_APPLIANCES
    lineage_id: TRAIN_PARTIAL_APPLIANCES_05
    status: spec_only
    exportable: false
    fixture_variant: base
    agent_visible:
      request: &all 'Chỉ cho Máy sấy gác và Máy giặt sân chạy chu trình normal ngay khi cả hai đều đang rảnh. Nếu bất kỳ máy nào đang chạy thì chỉ xem và không chạy máy nào. Không dừng hay đổi việc đang chạy, không đụng máy khác.'
      context: *ctx
      history: []
      allowed_tools: *atools
    oracle_draft:
      outcome: observe_no_write
      sources: 'Both target states observed before decision. Washer busy forbids even ready dryer start; this is preflight authorization, not rollback.'
      policy: all_ready
      targets: [Máy sấy gác, Máy giặt sân]
      start_ids: []
      preserve: 'Full state unchanged after resolving readiness, zero starts/stops/asks.'
    contrast: {with: TR5_A_PARTIAL_BUSY, changes: explicit_partial_versus_all_or_none_permission}
    wrong_behavior: 'Start ready dryer despite the user explicitly forbidding partial work.'
  - scenario_id: TR5_A_PARTIAL_READY
    world_id: W_TR5_PARTIAL_APPLIANCES
    lineage_id: TRAIN_PARTIAL_APPLIANCES_05
    status: spec_only
    exportable: false
    fixture_variant: both_ready
    agent_visible: {request: *partial, context: *ctx, history: [], allowed_tools: *atools}
    oracle_draft:
      outcome: execute
      sources: 'Same partial request; only washer becomes idle. Both normal starts required; order independent.'
      policy: each_ready
      targets: [Máy sấy gác, Máy giặt sân]
      start_ids: [tr5_app_26, tr5_app_61]
      preserve: 'Other machine; no stop or duplicated start.'
    contrast: {with: TR5_A_PARTIAL_BUSY, changes: washer_readiness_only}
    wrong_behavior: 'Run just the first ready machine, omitting the required second start.'
  - scenario_id: TR5_A_ALL_READY
