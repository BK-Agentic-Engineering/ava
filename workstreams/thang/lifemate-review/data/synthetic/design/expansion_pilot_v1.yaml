      allowed_tools: [email.list, email.read, reminders.create, sys.ask_missing_info]
    oracle_draft:
      outcome: execute
      source_match: {subject: Mốc nộp bảng kê, from: kho@duyenmay.example.test}
      required_evidence: {ID: 'List trả unique compound match exp1_mail_42 trước read(ID đó).', time: 'Read đúng ID trả email.body: Thời điểm gửi bảng kê: 2026-12-03T10:15:00+07:00. Dùng timestamp này, không 14:35/11:55 từ thư khác.', content: Gửi bảng kê vật liệu từ request}
      required_effects: {new_reminder_count: 1, time: '2026-12-03T10:15:00+07:00', repeat: once, done: false, content_meaning: Gửi bảng kê vật liệu, total_write_count: 1, ask_count: 0}
      forbidden_changes: ['Áp shared frame; đúng một reminder mới, không đổi email/old reminder, không đoán time hoặc dùng body sai source.']
    contrast: {with: EXP1_E_B, changes: request.sender_only, invariant: 'Toàn fixture/context/history/tools/subject/content giữ nguyên; đổi sender chọn email khác và time khác.'}
    wrong_behavior: {example: Read thư khác cùng subject rồi tạo lúc 14:35., caught_by: 'Compound identity sai, source-time không ground; expected time là 10:15.'}
    minimum_replay: {positive: 'List rồi chọn subject+sender, read actual body, extract time và create; đọc distractor trước/sau được phép.', negative: 'Cả subject-only và sender-only shortcut; list/create guess; hidden-ID read phải fail đúng identity/grounding.'}

