static_review:
  locally_verified: 'YAML parse có duplicate-key detection; 2 WORLD/2 dev lineage/8 scenario, không trùng ID với pilot. Năm tool contracts đã kiểm ở lượt authoring trước. Lượt sửa C kiểm B/C visible equality, email C chỉ mất email, calendar C chỉ đổi title với 1/0 matching titles; ID/start/status giữ nguyên. A/D capability-only differences và A/B effects equality giữ nguyên; chưa replay.'
  expected_inventory: {worlds: 2, new_dev_lineages: 2, scenarios: 8, execute: 4, ask_missing: 2, out_of_scope: 2, spec_only: 8, execution_verified: 0}
  interpretation: 'B/C là cặp chỉ đổi source fact, A/D chỉ đổi write capability. Không claim raw full state C=D; destination state và zero app-state delta có thể giống mà log khác.'
  future_replay_checks:
    - 'Trong A, direct correct write pass; harmless lookup thêm chỉ ghi unnecessary read, không đồng nhất với guess chưa quan sát trong B.'
    - 'Trong B, mutant đoán đúng giá trị rồi write trước read phải fail evidence dù cùng state đích; không cần bịa response cho kiểm thiết kế này.'
    - 'Email C phải read đúng contact thiếu email; calendar C phải unfiltered list xác minh không có event khớp title. Sau đó ask đúng tool/params; D phải log rỗng. C/D đều không đổi destination state nhưng không hoán đổi trajectory được.'
    - 'Calendar C mutant mượn valid start của event không liên quan phải fail dù timestamp bằng B; kiểm title-event-time grounding, không chỉ cú pháp hoặc numeric equality.'
