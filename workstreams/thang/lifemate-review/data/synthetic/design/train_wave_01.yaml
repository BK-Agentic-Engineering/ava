split: train
status: spec_only
exportable: false
provenance:
  selection_before_authoring: docs/implementation/TRAIN_WAVE_01_HANDOFF.md
  source_policy: 'Independent Vietnamese requests, fixtures and gold. Catalog/runtime are interface specifications only; no organizer records, benchmark seeds or dev-template instantiation.'
