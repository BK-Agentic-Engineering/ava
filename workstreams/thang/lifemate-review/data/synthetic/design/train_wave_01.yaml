    exportable: false
    fixture_variant: base
    agent_visible:
      request: 'Chỉ lưu một email nháp, chưa gửi, tới dieu@laco.example.test, tiêu đề "Phiếu khay", nội dung nguyên văn "Tôi nhận bốn khay, không nhận thêm." Không đồng gửi ai.'
      context: {current_time: '2026-12-15T09:00:00+07:00', timezone: Asia/Saigon}
      history: []
      allowed_tools: [email.list, email.read, email.create_draft, email.send, email.reply]
    oracle_draft:
      outcome: execute
      supplied: 'To, subject, body, no CC, save-only permission.'
      required_observations: []
      writes: [{name: email.create_draft, arguments: {to: [dieu@laco.example.test], subject: Phiếu khay, body: 'Tôi nhận bốn khay, không nhận thêm.', cc: []}}]
