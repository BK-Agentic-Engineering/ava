    origin: independently_authored
    ancestry: {parent_world_ids: [], parent_scenario_ids: [], parent_lineage_ids: []}
    independence: 'Two persistent note contents with directional copying and retained prefixes; not a dev reminder-create or email-time template. New-record versus in-place append is an explicit authorized-effect contrast.'
    design_base: TR1_N_APPEND
    relevant_tools: [notes.list, notes.create, notes.append]
    assumptions: 'Initial titles unique. List exposes full content. Create may intentionally reuse a title when the user explicitly requests a separate note; never merge or overwrite.'
    variants: {}
    initial_state:
      notes:
        notes:
          - {id: tr1_note_26, title: Sổ đóng kiện, content: 'Dùng dây đay, không dùng ghim.', color: brown}
          - {id: tr1_note_73, title: Bảng vật liệu, content: 'Giữ lại ba tấm lót.', color: green}
          - {id: tr1_note_81, title: Danh mục riêng, content: Chưa được sửa mục này., color: gray}
  - world_id: W_TR1_SHOP_LIFECYCLE
