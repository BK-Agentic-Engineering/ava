  visibility: 'Context, request, history and permissions only. Runtime materializer adds installed_apps from allowed_tools; opaque fixture IDs are private until actual lookup.'
  semantics: 'Author reviewed each request before replay implementation. All quoted content requested verbatim; no general fuzzy-text or Vietnamese interpreter. No ambiguous cases silently counted.'
  alternatives: 'Extra permitted non-mutating reads and independent write order allowed. Optional omitted cc and explicit [] equivalent. Exact write count is task-specific, not a universal failure rule.'
worlds:
  - world_id: W_TR1_MAIL_DISPOSITION
    lineage_id: TRAIN_MAIL_DISPOSITION_01
    split: train
    origin: independently_authored
    ancestry: {parent_world_ids: [], parent_scenario_ids: [], parent_lineage_ids: []}
    independence: 'Outgoing draft/send collections versus reply-linked incoming state; no dev contact-availability or body-time construction. Closest B02_E and B04_E share email tools only.'
    design_base: TR1_E_DRAFT
    relevant_tools: [email.list, email.read, email.create_draft, email.send, email.reply]
    assumptions: 'Two incoming threads uniquely identified by title, same sender intentionally. No body extraction needed. Existing sent/draft records must survive.'
    variants: {}
    initial_state:
      email:
        emails:
          - {id: tr1_mail_14, from: desk@laco.example.test, subject: Kiểm kê khay, body: Xin xác nhận đã nhận bảng kê., unread: true, replied: false, folder: inbox}
