    ancestry: {parent_world_ids: [], parent_scenario_ids: [], parent_lineage_ids: []}
    independence: 'Purchase-mark retains quantity, removal deletes identity, separate addition retains the old row even with same name. Not dev state-selected light switching or menu-backed order creation.'
    design_base: TR1_S_CHECK
    relevant_tools: [shopping_list.get, shopping_list.add, shopping_list.check, shopping_list.remove]
    assumptions: 'Each initial name unique, all initially unchecked. A new same-name row remains distinct and unchecked. Mixed actions bind each verb to its named old row; independent action order permitted.'
    variants: {}
    initial_state:
      shopping_list:
        items:
          - {id: tr1_item_35, name: mì gạo, quantity: 3, checked: false}
          - {id: tr1_item_62, name: gừng, quantity: 1, checked: false}
          - {id: tr1_item_94, name: nấm khô, quantity: 4, checked: false}
