  - scenario_id: TR3_M_PLAY
    world_id: W_TR3_MUSIC_MEMBERSHIP
    lineage_id: TRAIN_MUSIC_MEMBERSHIP_03
    status: spec_only
    exportable: false
    fixture_variant: base
    agent_visible:
      request: 'Phát bài hát "Sương sân", không phát danh sách cùng tên và không thêm bài vào danh sách nào.'
      context: *ctx
      history: []
      allowed_tools: *mtools
    oracle_draft:
      outcome: execute
