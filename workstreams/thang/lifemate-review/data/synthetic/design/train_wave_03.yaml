  - scenario_id: TR3_M_PLAY_LIST
    world_id: W_TR3_MUSIC_MEMBERSHIP
    lineage_id: TRAIN_MUSIC_MEMBERSHIP_03
    status: spec_only
    exportable: false
    fixture_variant: base
