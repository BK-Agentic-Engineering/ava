interface_pair:
  archive: 'D:/Downloads/train+public_test.zip'
  release: v3.2.0
  catalog_member: train+public_test/train/train_tools_catalog.json
  catalog_schema_version: '2.7.0'
  runtime_root: train+public_test/train/zaic_tools/
  checked_sources: [apps/calendar.py, apps/base.py, executor.py]
  capability_contracts:
    calendar.list_events: {required: [], optional_used: [date_from]}
    calendar.cancel_event: {required: [event_id], optional_used: []}
    sys.ask_missing_info: {required: [tool_name, params], optional_used: []}
  behavior: 'List trả events[] và optional date range theo start, không sửa state. Cancel patch status=cancelled, giữ fields khác; repeat cancel vẫn log/patch kể cả state không đổi. Không có API tự chọn referent từ history.'
authoring_conventions:
  visibility: 'WORLD/oracle/ancestry/semantic review là private. IDs chỉ lộ từ actual permitted lookup; materializer đồng bộ installed_apps và _meta.tools/current_time.'
  coverage: 'H1/H2 đã có history selection; mới ở đây là giữ explicit selection qua incidental later mention. C/D là explicit-title controls, không hai cơ chế mới.'
  history_state: 'Selection là chuẩn bị, assistant xác nhận chưa hủy; exchange sau chỉ giải nghĩa title C, không đổi selection hoặc authorize mutation. Initial state cả ba confirmed; không materialize historical writes.'
  semantic_review: 'Đã đọc bốn visible conversations trước trace: user chọn duy nhất một event để hủy và bảo đợi; câu hỏi sau về nghĩa từ soát chỉ informative. Latest request Bây giờ hủy mới authorize mutation. Không có reasonable competing target theo wording này; independent reviewer/team chưa kiểm chứng.'
  limitations: 'Executor không consume history. Target lấy từ reviewed oracle, không history parser/model evaluation. Không chặn local replay do thiếu team harness; không giả đã integrate.'
  alternatives: 'List unfiltered hoặc date_from lấy từ visible current date nếu thực sự trả target đều valid; harmless repeated reads được phép. Không exact shortest trace hay natural-language final response requirement.'
  trace_policy: 'Đúng một cancel đúng target; giữ mọi attempts/failures/no-ops. Reject theo authored count/target/evidence/frame, không universal failed-call rule. Không state_hash substitute.'
